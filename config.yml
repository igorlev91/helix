name: helix-dev
datadir: data
database: postgres:localdb@localhost:5432/helix
port: 7350
ops_port: 7351
verbose: true
session:
  encryption_key: defaultencryptionkey  # change in production
  refresh_encryption_key: defaultrefreshencryptionkey
  token_expiry_sec: 3600
cluster:
  enabled: true
  peers: ["localhost:7352"]
auth:
  google_client_id: dev-google-client
  apple_client_id: dev-apple-client
  google_jwks_url: http://localhost:7399/google-jwks  # test override; prod: googleapis.com
  apple_jwks_url: http://localhost:7399/apple-jwks    # test override; prod: appleid.apple.com
